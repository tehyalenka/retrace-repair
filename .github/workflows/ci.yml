name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run unit test regression suite (240 tests)
      run: |
        PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Validate all 22 task fixtures
      run: |
        PYTHONPATH=src:. python -m benchmarks.v18.task_suite_runner validate

    - name: Verify mutation hardening (100% mutant kill score)
      run: |
        PYTHONPATH=src:. python -m benchmarks.v18.hardening
