[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-x"
version = "0.8.1"
description = "Repository-aware coding agent with test feedback"
requires-python = ">=3.9"
dependencies = ["requests>=2.28,<3", "urllib3>=1.26.18,<2; python_version < '3.10'"]

[project.scripts]
codepilot = "codepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
